<svg xmlns="http://www.w3.org/2000/svg" width="22" height="23" viewBox="0 0 22 23" fill="#00FF87" role="img" aria-label="musical note">
  <!-- stems -->
  <rect x="5.4" y="2.4" width="1.9" height="17.4"/>
  <rect x="16.1" y="0.8" width="1.9" height="15.6"/>
  <!-- double beam (sixteenth notes) -->
  <polygon points="5.4,2.4 18,0.8 18,3.4 5.4,5.0"/>
  <polygon points="5.4,6.0 18,4.4 18,7.0 5.4,8.6"/>
  <!-- note heads -->
  <ellipse cx="4.0" cy="19.8" rx="3.3" ry="2.4" transform="rotate(-20 4.0 19.8)"/>
  <ellipse cx="14.7" cy="16.4" rx="3.3" ry="2.4" transform="rotate(-20 14.7 16.4)"/>
</svg>
