[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conductorscore"
version = "0.6.0"
description = "ConductorScore Client"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []  # stdlib only — privacy + portability

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-httpserver>=1.0"]

[tool.setuptools.packages.find]
exclude = ["tests*"]  # tests are not shipped in the installed skill

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
